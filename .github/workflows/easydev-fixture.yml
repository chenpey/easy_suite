name: easydev-fixture

on:
  push:
    paths:
      - 'easydev/**'
  pull_request:
    paths:
      - 'easydev/**'
  workflow_dispatch:

jobs:
  public-contract-callers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash easydev/tests/cases/public-contract-callers/run.sh
      - name: Offline unit tests
        run: |
          python3 -m unittest discover -s easydev/tests/experiments/agent_runner -p 'test_*.py' -v
          python3 -m unittest discover -s easydev/tests/experiments/swebench -p 'test_*.py' -v
