name: Release EasyJev

on:
  push:
    tags:
      - "easyjev-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate version
        run: |
          tag_version="${GITHUB_REF_NAME#easyjev-v}"
          node -e "
            const versions = JSON.parse(require('fs').readFileSync('versions.json', 'utf8'));
            if (versions.easyjev !== '$tag_version') {
              console.error('Tag version $tag_version does not match versions.json: ' + versions.easyjev);
              process.exit(1);
            }
          "
          node --check easyjev/easyjev
          node scripts/version.mjs check

      - name: Prepare assets
        run: |
          mkdir -p release
          cp easyjev/easyjev release/easyjev
          chmod +x release/easyjev
          cd release
          sha256sum easyjev > easyjev.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#easyjev-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/easyjev release/easyjev.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/easyjev \
              release/easyjev.sha256 \
              --verify-tag \
              --title "EasyJev v${version}" \
              --notes-file easyjev/RELEASE_NOTES.md
          fi
