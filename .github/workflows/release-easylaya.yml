name: Release EasyLaya

on:
  push:
    tags:
      - "easylaya-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_name: easylaya-darwin-arm64
            archive_type: binary
          - os: ubuntu-latest
            asset_name: easylaya-linux-x64
            archive_type: binary
          - os: windows-latest
            asset_name: easylaya-windows-x64
            archive_type: zip
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ runner.os }}" = "Linux" ] || [ "${{ runner.os }}" = "Windows" ]; then
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r easylaya/requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        shell: bash
        run: |
          cp easylaya/easylaya easylaya/entry.py
          pyinstaller --onefile --collect-all laya easylaya/entry.py --name "${{ matrix.asset_name }}"

          python -c '
          import os, sys, shutil, zipfile, hashlib

          asset_name = "${{ matrix.asset_name }}"
          archive_type = "${{ matrix.archive_type }}"
          os.makedirs("dist_release", exist_ok=True)

          if archive_type == "zip":
              exe_src = os.path.join("dist", f"{asset_name}.exe")
              zip_dest = os.path.join("dist_release", f"{asset_name}.zip")
              with zipfile.ZipFile(zip_dest, "w", zipfile.ZIP_DEFLATED) as zf:
                  zf.write(exe_src, arcname="easylaya.exe")
              target_file = zip_dest
          else:
              bin_src = os.path.join("dist", asset_name)
              bin_dest = os.path.join("dist_release", asset_name)
              shutil.copy2(bin_src, bin_dest)
              os.chmod(bin_dest, 0o755)
              target_file = bin_dest

          with open(target_file, "rb") as f:
              digest = hashlib.sha256(f.read()).hexdigest()

          with open(f"{target_file}.sha256", "w", encoding="utf-8") as f:
              f.write(f"{digest}  {os.path.basename(target_file)}\n")

          print(f"Artifact created: {target_file} with SHA256 {digest}")
          '

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist_release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate version
        run: |
          tag_version="${GITHUB_REF_NAME#easylaya-v}"
          node -e "
            const versions = JSON.parse(require('fs').readFileSync('versions.json', 'utf8'));
            if (versions.easylaya !== '$tag_version') {
              console.error('Tag version $tag_version does not match versions.json: ' + versions.easylaya);
              process.exit(1);
            }
          "
          node scripts/version.mjs check

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#easylaya-v}"
          files=(release_assets/*)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file easylaya/RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "${files[@]}" \
              --verify-tag \
              --title "EasyLaya v${version}" \
              --notes-file easylaya/RELEASE_NOTES.md
          fi
