name: Update Release Notes

on:
  push:
    branches:
      - main
    paths:
      - "easylaya/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view easylaya-v0.1.0 >/dev/null 2>&1; then
            gh release edit easylaya-v0.1.0 --notes-file easylaya/RELEASE_NOTES.md
            echo "Successfully updated release notes for easylaya-v0.1.0"
          fi
