name: version-check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs check
      - name: Repository script tests
        run: node --test test/version.test.mjs
      - name: Project-owned reset tests
        run: |
          for file in */test/reset.test.mjs; do
            node --test "$file"
          done
